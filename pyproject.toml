[project]
name = "teyvat-leyline"
version = "0.1.0"
description = "提瓦特地脉 · Teyvat Leyline — Genshin Impact 风格的 Python 多线程下载器（Electron + Python 混合开发，FastAPI 后端 + Vue3 界面）"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "luoqingciya", email = "luoqingciya@users.noreply.github.com" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["downloader", "multi-threaded", "electron", "fastapi", "genshin-impact", "aria2", "segment"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
  "httpx[socks]>=0.27.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
build = [
  "pyinstaller>=6.0",
]

[project.scripts]
teyvat-leyline = "teyvat_leyline.__main__:main"
teyvat-server = "teyvat_leyline.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teyvat_leyline"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
