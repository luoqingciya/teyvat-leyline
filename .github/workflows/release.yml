name: Release

# 推送 v* 标签（如 v0.2.0）时自动打包并发布 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Publish (${{ github.ref_name }})
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # ---- 1. 后端：lint + 测试 ----
      - name: Install Python dependencies
        run: uv sync --all-extras --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest

      # ---- 2. 打包 Python 后端为单文件 EXE，产出 backend-dist/teyvat-server.exe ----
      - name: Build backend (PyInstaller)
        run: pwsh -File build-backend.ps1

      # ---- 3. 前端：依赖 + Electron 应用打包（含 web installer 产物） ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # 推送的包版本名（如 v0.2.0 → 0.2.0），回写 package.json 使产物名/安装包版本一致
      - name: Sync version from tag
        working-directory: app
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          npm pkg set version="$ver"
          "synced version: $ver"

      # 先编译渲染层与主进程到 out/，electron-builder 从 out/main/index.js 启动
      - name: Build renderer & main
        working-directory: app
        run: npm run build

      - name: Build & publish to GitHub Release
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --config electron-builder.yml --publish always

      # ---- 4. 上传便携版解压目录（可选，方便直接运行） ----
      - name: Upload portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-unpacked
          path: app/release/win-unpacked
          retention-days: 7